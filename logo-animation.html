<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Li'San collective — logo animation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;700&display=swap" rel="stylesheet">
<style>
  /* ---------- demo page only ---------- */
  html, body { margin: 0; height: 100%; }
  body {
    display: grid; place-items: center; gap: 24px;
    background: linear-gradient(135deg, #d6d6d4, #bfc0bd);
    font-family: Poppins, sans-serif;
  }
  .demo { width: min(92vw, 720px); }
  .replay {
    font: 300 14px/1 Poppins, sans-serif; letter-spacing: .08em;
    padding: 10px 18px; border: 1px solid #520521; background: transparent;
    color: #520521; cursor: pointer;
  }
  .replay:hover { background: #520521; color: #fff; }

  /* ---------- logo (copy from here) ---------- */
  .lisan-logo {
    --lisan-brand: #520521;   /* rectangle */
    --lisan-lines: #3b0418;   /* construction lines */
    --lisan-text:  #ffffff;   /* wordmark */
    display: block; width: 100%; height: auto; overflow: visible;
  }
  .lisan-logo .line {
    fill: none; stroke: var(--lisan-lines); stroke-width: 1.4;
    stroke-linecap: square;
    stroke-dasharray: 1; stroke-dashoffset: 1;   /* pathLength="1" on each line */
    animation: lisan-draw .7s cubic-bezier(.65,0,.35,1) forwards;
  }
  .lisan-logo .l-top    { animation-delay: .10s; }
  .lisan-logo .l-left   { animation-delay: .30s; }
  .lisan-logo .l-bottom { animation-delay: .50s; }
  .lisan-logo .l-right  { animation-delay: .70s; }

  .lisan-logo .block {
    fill: var(--lisan-brand);
    clip-path: inset(0 100% 0 0);
    animation: lisan-wipe .8s cubic-bezier(.77,0,.18,1) 1.2s forwards;
  }
  .lisan-logo .word {
    font-family: Poppins, sans-serif; fill: var(--lisan-text);
    opacity: 0;
    animation: lisan-rise .9s cubic-bezier(.16,1,.3,1) forwards;
  }
  .lisan-logo .w-lisan      { font-weight: 700; animation-delay: 1.75s; }
  .lisan-logo .w-collective { font-weight: 700; animation-name: lisan-slide; animation-delay: 2.05s; }
  .lisan-logo .w-tagline    { font-weight: 300; animation-name: lisan-fade; animation-duration: 1.1s; animation-delay: 2.5s; }

  @keyframes lisan-draw  { to { stroke-dashoffset: 0; } }
  @keyframes lisan-wipe  { to { clip-path: inset(0 0 0 0); } }
  @keyframes lisan-rise  { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes lisan-slide { from { opacity: 0; transform: translateX(-18px); } to { opacity: 1; transform: none; } }
  @keyframes lisan-fade  { to { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    .lisan-logo * { animation-duration: .01s !important; animation-delay: 0s !important; }
  }
</style>
</head>
<body>

<div class="demo">
  <!-- ---------- logo (copy from here) ---------- -->
  <svg class="lisan-logo" viewBox="0 0 600 200" role="img" aria-label="Li'San collective — interior projects">
    <!-- architectural construction lines, drawn first -->
    <line class="line l-top"    x1="14"  y1="37"  x2="312" y2="37"  pathLength="1"/>
    <line class="line l-left"   x1="55"  y1="10"  x2="55"  y2="172" pathLength="1"/>
    <line class="line l-bottom" x1="35"  y1="143" x2="292" y2="143" pathLength="1"/>
    <line class="line l-right"  x1="263" y1="10"  x2="263" y2="178" pathLength="1"/>

    <!-- brand block, wiped in along the lines -->
    <rect class="block" x="55" y="37" width="208" height="106"/>

    <!-- wordmark -->
    <text class="word w-lisan"      x="90"  y="124" font-size="54" letter-spacing="0.5">Li’San</text>
    <text class="word w-collective" x="270" y="124" font-size="54" letter-spacing="1.5">collective</text>
    <text class="word w-tagline"    x="283" y="175" font-size="25" textLength="214" lengthAdjust="spacing">interior projects</text>
  </svg>
  <!-- ---------- /logo ---------- -->
</div>

<button class="replay" type="button">REPLAY</button>

<script>
  // demo only: restart the animation
  document.querySelector('.replay').addEventListener('click', () => {
    const svg = document.querySelector('.lisan-logo');
    svg.replaceWith(svg.cloneNode(true));
  });
</script>
</body>
</html>
